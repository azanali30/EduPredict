# EduPredict Single-Institution Production Apache HTTP Server Reverse Proxy Template
# Maps single-institution domain (edupredict.com) to single-process multi-threaded Waitress WSGI on 127.0.0.1:8000

<VirtualHost *:80>
    ServerName edupredict.com
    Redirect permanent / https://edupredict.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName edupredict.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/edupredict.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/edupredict.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    # Real-Time SSE Stream (disable response buffering and keep connection open)
    ProxyPass /api/stream/events http://127.0.0.1:8000/api/stream/events flushpackets=on
    ProxyPassReverse /api/stream/events http://127.0.0.1:8000/api/stream/events

    # Backend API & Health Check
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /auth http://127.0.0.1:8000/auth
    ProxyPassReverse /auth http://127.0.0.1:8000/auth

    # Frontend Static SPA
    DocumentRoot /var/www/edupredict/frontend/dist
    <Directory /var/www/edupredict/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
