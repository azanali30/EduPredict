# EduPredict Phase 9 Production Apache HTTP Server Reverse Proxy Template
# Maps wildcard tenant subdomains (*.edupredict.com) to Waitress WSGI backend on 127.0.0.1:8000

<VirtualHost *:80>
    ServerName edupredict.com
    ServerAlias *.edupredict.com
    Redirect permanent / https://%{HTTP_HOST}%{REQUEST_URI}
</VirtualHost>

<VirtualHost *:443>
    ServerName edupredict.com
    ServerAlias *.edupredict.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/edupredict.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/edupredict.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    # Backend API & Health Check
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /auth http://127.0.0.1:8000/auth
    ProxyPassReverse /auth http://127.0.0.1:8000/auth

    # Frontend Static SPA
    DocumentRoot /var/www/edupredict/frontend/dist
    <Directory /var/www/edupredict/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
